# Prod compose for orion (#340, bot part; map #327 "Move scope").
# On orion: ~/wojtusdiscord/ holds a copy of this file as compose.yml, deploy/init/, deploy/db-backup/, and .env (0600, by hand, never in git).
# Keys of .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_MONITOR_PASSWORD (role wojtus_monitor, init/10-readonly-roles.sql), DISCORD_TOKEN (the DEV token until #343 step 4), the
# bot keys copied from the homelab .env (Anthropic__*, OpenRouter__*, HealthCheck__*, MemeIndex__*), and for db-backup R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, HC_BACKUP_URL, HC_RESTORE_URL. The shared stack (network `observability`, Tempo, Prometheus) comes from repo `orion`.
# Login gate (#339), the bot refuses to start without it: Auth__Mode=Discord, Auth__GuildId, Auth__AdminUserIds__0.., Auth__OpsApiKey, Auth__Discord__ClientId, Auth__Discord__ClientSecret.
#
# Until the cutover (#343) the bot stays stopped:  docker compose up -d postgres postgres-exporter
# A deploy (#342) stays bot-only (#400):           docker compose pull discord-event-service && docker compose up -d --no-deps discord-event-service
name: wojtusdiscord

services:
  postgres:
    image: postgres:18
    # Stable name: postgres-exporter and the dashboards point at it.
    container_name: wojtus-postgres
    # pg_stat_statements feeds the query panels of the Postgres dashboard.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-discord_event_service}
    # No published port: the agent reads over SSH + docker exec (#496).
    volumes:
      # postgres:18 moved the data root up a level (docker-library/postgres#1259).
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  discord-event-service:
    image: ghcr.io/wiktorkowalski/wojtusdiscord/discord-event-service:${IMAGE_TAG:-latest}
    # Stable name: the Loki label container_name, the Prometheus target and the dashboards use it.
    container_name: discord-event-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-discord_event_service};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?}
      Discord__Token: ${DISCORD_TOKEN:?}
      Database__AutoMigrate: "true"
      # Shared Tempo from repo `orion` (OTLP/HTTP). Not a secret.
      Telemetry__OtlpTracesEndpoint: http://tempo:4318
    # No published port: craftops already holds 8080 on the host, and only Prometheus reaches /metrics.
    networks: [default, observability]
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy

  # Read-only: role wojtus_monitor (pg_monitor), not the superuser.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: wojtus-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-discord_event_service}?sslmode=disable"
      DATA_SOURCE_USER: wojtus_monitor
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:?}
    command:
      - '--collector.long_running_transactions'
      - '--collector.database_wraparound'
      - '--collector.stat_activity_autovacuum'
      - '--collector.statio_user_indexes'
      - '--collector.postmaster'
      - '--collector.stat_statements'
      # Normalised SQL ($1..$n), no user data.
      - '--collector.stat_statements.include_query'
    networks: [default, observability]
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly pg_dump to Cloudflare R2 and a weekly restore drill (#332); details in db-backup/db-backup.sh, restore in db-backup/RESTORE.md.
  # Built on orion and updated by hand, like postgres:  docker compose up -d --build --no-deps db-backup
  # One run now:  docker compose run --rm db-backup backup   (or: drill)
  # The R2_* and HC_* keys default to empty on purpose: a missing key must not break the bot deploy,
  # which reads this whole file; the script fails and pings /fail instead.
  db-backup:
    build: ./db-backup
    image: wojtusdiscord-db-backup:local
    container_name: wojtus-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-discord_event_service}
      BACKUP_AT: "02:30"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      HC_BACKUP_URL: ${HC_BACKUP_URL:-}
      HC_RESTORE_URL: ${HC_RESTORE_URL:-}
    volumes:
      # Two nights stay here for a fast restore; cutover-20261107.dump next to them is not touched.
      # The container runs as uid 999: once, before the first up:  sudo chown 999:999 /srv/db-dumps/wojtusdiscord && sudo chmod 700 /srv/db-dumps/wojtusdiscord
      - /srv/db-dumps/wojtusdiscord:/dumps
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy

networks:
  observability:
    external: true

volumes:
  postgres_data:
