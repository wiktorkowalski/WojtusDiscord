stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

usage_report:
  reporting_enabled: false

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 2160h  # 90 days, same as Prometheus and Loki

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# local-blocks powers TraceQL metrics from Tempo's own disk. span-metrics and
# service-graphs are written to Prometheus, which runs with
# --web.enable-remote-write-receiver for this.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, service-graphs, span-metrics]
