        values: '1000x90'
      - series: 'wojtus_process_uptime_seconds{job="wojtusdiscord",instance="b"}'
        values: '3600+60x90'
    alert_rule_test:
      - {eval_time: 40m, exp_alerts: [], alertname: WojtusEventFailureRatioHigh}
  # One burst, not a slowdown: two events take 2.5 to 5 s at minute 10, everything after is fast. The p95 of
