        values: '1000x90'
      - series: 'wojtus_process_uptime_seconds{job="wojtusdiscord",instance="b"}'
        values: '3600+60x90'
    alert_rule_test:
      - eval_time: 40m
        alertname: WojtusEventFailureRatioHigh
        exp_alerts:
          - exp_labels: {severity: warning, service: wojtusdiscord}
            exp_annotations:
              summary: "9.091% of gateway events fail"
              description: "More than 5% of at least 20 events in 30 minutes had a failed handler (2 of 20, 3 of 40). Check the bot log for 'Error handling' and whether Postgres accepts writes."
      - {eval_time: 80m, exp_alerts: [], alertname: WojtusEventFailureRatioHigh}
