            exp_annotations:
              summary: "Event handler p95 is 3.75s"
              description: "The p95 of at least 20 events in 30 minutes has been above 2 s for 40 minutes. Normal is about 90 ms. Check Postgres (locks, long transactions) and the per-type panel on the Events & Ingest dashboard."
  # Small-server floors (2026-10-07): 30 events in 30 minutes is a normal busy half hour here.
  # Three failed handlers among them fire the ratio rule; one does not.
  - interval: 1m
    input_series:
      - series: 'wojtus_events_total{job="wojtusdiscord",instance="b",event_type="PresenceUpdated",outcome="ok"}'
        values: '0+1x90'
