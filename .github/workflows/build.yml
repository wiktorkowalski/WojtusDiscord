name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

# #326: one Build and Deploy run per ref at a time, so build+push+deploy of
# commit N finishes before N+1 pushes :latest. (GitHub keeps only one *pending*
# run per group: with three quick merges the middle one is superseded, the
# newest still deploys last.)
# master: never cancel — every run must complete.
# PR refs: no :latest push and no deploy, so a superseded dual-arch build is
# pure waste — cancel it.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deploy:
    uses: wiktorkowalski/github-workflows/.github/workflows/dotnet-docker-deploy.yml@master
    with:
      image-name: ${{ github.repository }}/discord-event-service
      dotnet-project: src/DiscordEventService/DiscordEventService.csproj
      dockerfile: src/DiscordEventService/Dockerfile
      # Repo root: the Dockerfile bundles the sibling src/Dashboard SPA.
      context: .
      # #193: /health reports the deployed commit.
      build-args: GIT_SHA=${{ github.sha }}
      # #342: dual-arch during the homelab -> EC2 (t4g, arm64) migration window;
      # drop linux/amd64 after cutover (#343).
      platforms: linux/amd64,linux/arm64
      deploy-compose-path: /home/ubuntu/docker/wojtusdiscord
      deploy-runner-labels: '["self-hosted", "homelab"]'
    secrets: inherit
