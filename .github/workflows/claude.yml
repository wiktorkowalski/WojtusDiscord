name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  pull_request:
    # #352: a PR opened as a draft and later marked ready fires neither `opened` nor
    # `synchronize`, and the reusable job requires `draft == false` — so without
    # `ready_for_review` the required `review / Claude Review` check never reports and
    # the PR is stuck. `reopened` closes the same gap for a reopened PR.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  review:
    uses: wiktorkowalski/github-workflows/.github/workflows/claude-code-review.yml@master
    with:
      runner-labels: '["self-hosted", "homelab"]'
    secrets: inherit
